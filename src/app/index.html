<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InTandem Desk · Admin/Owner</title>
  <meta name="description" content="InTandem Desk — office operations for InTandem Build, a PMC firm in Hyderabad.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="shared/itd-core.css">
  <link rel="stylesheet" href="shared/itd-auth.css">
</head>
<body>

  <!-- ═══ Authentication gate ═══════════════════════════════════════
       Covers the entire application until itd-admin-auth.js has proved
       the signed-in account is an administrator. App.start() is called
       from that module, so no page renders behind this. -->
  <div id="authGate">
    <div class="authcard" id="authCard">
      <div class="authspin"></div>
      <p class="authmsg">Connecting…</p>
    </div>
  </div>
  <div class="authtoast" id="authToast"></div>
  <script>
    /* If the auth module never runs — CDN blocked, offline, opened over
       file:// — say so instead of spinning forever. */
    window.__itdAuthUp = false;
    setTimeout(function () {
      if (window.__itdAuthUp) return;
      var c = document.getElementById('authCard');
      if (!c) return;
      c.className = 'authcard authcard--warn';
      c.innerHTML = '<div class="authcard__mark"><i class="fa-solid fa-triangle-exclamation"></i></div>' +
        '<h1>Can\'t start sign-in</h1>' +
        '<p class="authmsg">The authentication module did not load. Google sign-in needs the page served over http(s) — it cannot run from a <code>file://</code> path.</p>' +
        '<p class="authnote">Run <code>firebase serve</code> locally, or open the deployed URL.</p>';
    }, 6000);
  </script>

  <!-- Boot -->
  <div class="boot" id="boot">
    <div class="boot__bars"><span></span><span></span><span></span><span></span></div>
    <div class="boot__text">Loading project data…</div>
  </div>

  <!-- Topbar -->
  <header class="topbar">
    <button class="iconbtn" id="navToggle" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button>
    <a class="brand" href="#/dashboard">
      <span class="brand__mark">ID</span>
      <span class="brand__text"><b>InTandem Desk</b></span>
      <span class="brand__tag">Admin/Owner</span>
    </a>
    <div class="search">
      <div class="search__field"><i class="fa-solid fa-magnifying-glass"></i>
        <input id="searchInput" type="text" placeholder="Search vendors, budget, schedule, ledger…" aria-label="Search"><kbd>/</kbd>
      </div>
      <div class="search__panel" id="searchPanel" hidden></div>
    </div>
    <div class="topbar__spacer"></div>
    <span class="stamp" id="dataStamp" hidden><i class="fa-regular fa-clock"></i> Data as of <b id="dataStampDate"></b></span>
    <span class="authuser" id="authUser" hidden></span>
    <div class="notifwrap">
      <button class="iconbtn" id="notifBtn" aria-label="Notifications"><i class="fa-regular fa-bell"></i><span class="iconbtn__dot is-hidden" id="notifDot"></span></button>
      <div class="notifpanel" id="notifPanel" hidden>
        <div class="notifpanel__head"><b>Notifications</b><button class="btn btn--ghost btn--sm" id="notifClear">Mark all read</button></div>
        <div class="notifpanel__list" id="notifList"></div>
      </div>
    </div>
    <button class="iconbtn" id="themeBtn" aria-label="Toggle theme"><i class="fa-regular fa-sun"></i></button>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="navgroup">Overview</div>
    <a class="navlink" data-route="dashboard" href="#/dashboard"><i class="fa-solid fa-gauge-high"></i><span class="t">Dashboard</span></a>
    <a class="navlink" data-route="projects" href="#/projects"><i class="fa-solid fa-diagram-project"></i><span class="t">Projects</span></a>

    <div class="navgroup">Delivery</div>
    <a class="navlink" data-route="budget" href="#/budget"><i class="fa-solid fa-sack-dollar"></i><span class="t">Budget</span><span class="navlink__count" id="cBudget"></span></a>
    <a class="navlink" data-route="payments" href="#/payments"><i class="fa-solid fa-file-invoice-dollar"></i><span class="t">Payments</span></a>

    <div class="navgroup">Money</div>
    <a class="navlink" data-route="vendors" href="#/vendors"><i class="fa-solid fa-building"></i><span class="t">Vendors</span><span class="navlink__count" id="cVendors"></span></a>
    <a class="navlink" data-route="ledger" href="#/ledger"><i class="fa-solid fa-receipt"></i><span class="t">Ledger</span><span class="navlink__count" id="cLedger"></span></a>

    <div class="navgroup">Team &amp; Docs</div>
    <a class="navlink" data-route="staff" href="#/staff"><i class="fa-solid fa-users"></i><span class="t">Staff</span></a>
    <a class="navlink" data-route="reports" href="#/reports"><i class="fa-solid fa-file-lines"></i><span class="t">Reports</span></a>
    <a class="navlink" data-route="news" href="#/news"><i class="fa-solid fa-newspaper"></i><span class="t">News</span></a>
    <a class="navlink" data-route="settings" href="#/settings"><i class="fa-solid fa-gear"></i><span class="t">Settings</span></a>

    <div class="sidebar__foot">
      <!-- Populated by ITDBoot from window.DATA.meta. Hidden until a
           project exists, so a first-run install shows nothing here. -->
      <a class="projminicard" id="miniProj" href="#/projects" style="display:block; color:inherit" hidden>
        <div class="projminicard__label">Active project</div>
        <div class="projminicard__name" id="miniProjName"></div>
        <div class="settle settle--lg" id="miniSettle" style="--pct:0"><div class="settle__track"><span class="settle__fill"></span></div></div>
        <div class="faint" id="miniProjLoc" style="font-size:10.5px; margin-top:.5rem; font-family:var(--mono)"></div>
      </a>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <!-- Main -->
  <main class="shell">
    <section class="page" data-page="dashboard" id="page-dashboard"></section>
    <section class="page" data-page="projects" id="page-projects"></section>
    <section class="page" data-page="budget" id="page-budget"></section>
    <section class="page" data-page="payments" id="page-payments"></section>
    <section class="page" data-page="vendors" id="page-vendors"></section>
    <section class="page" data-page="ledger" id="page-ledger"></section>
    <section class="page" data-page="staff" id="page-staff"></section>
    <section class="page" data-page="reports" id="page-reports"></section>
    <section class="page" data-page="news" id="page-news"></section>
    <section class="page" data-page="settings" id="page-settings"></section>
  </main>

  <!-- Floating action button (Projects) -->
  <button class="fab" id="fabNewProject" hidden><i class="fa-solid fa-plus"></i><span>New Project</span></button>

  <!-- Toaster + modal -->
  <div class="toaster" id="toaster"></div>
  <div class="modal" id="modal">
    <div class="modal__card">
      <div class="modal__head"><h2 id="modalTitle">Details</h2><button class="iconbtn" data-close aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="modal__body" id="modalBody"></div>
      <div class="modal__foot" id="modalFoot"></div>
    </div>
  </div>

  <!-- ═══ Scripts ═══════════════════════════════════════════════════ -->
  <script>window.ITD_APP = 'admin';</script>
  <script src="shared/itd-config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="shared/itd-data.js"></script>
  <script src="shared/itd-demo.js"></script>
  <script src="shared/itd-core.js"></script>
  <script src="shared/itd-roles.js"></script>
  <script src="shared/itd-command.js"></script>
  <script src="shared/itd-auth-settings.js"></script>
  <script src="shared/itd-views-1.js"></script>
  <script src="shared/itd-views-2.js"></script>
  <script src="shared/itd-views-3.js"></script>
  <script>
    /* Called by itd-admin-auth.js once the account is verified.
       Deliberately NOT self-invoking — that is the whole point of the gate. */
    window.ITDBoot = function () {
      var D = window.DATA, m = D.meta;
      var el = function (id) { return document.getElementById(id); };
      var set = function (id, v) { var e = el(id); if (e) e.textContent = v; };

      /* Sidebar counts. A zero count shows nothing rather than a "0"
         badge, matching how the rest of a first-run install reads. */
      [['cSchedule', D.schedule.length], ['cBudget', D.budget.length],
       ['cVendors', D.vendors.length], ['cLedger', D.ledger.length]]
        .forEach(function (p) { set(p[0], p[1] || ''); });

      /* Data-as-of stamp: only once there is data to be as of. */
      var stamp = el('dataStamp');
      if (stamp && m.reportDate) {
        set('dataStampDate', new Date(m.reportDate)
          .toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }));
        stamp.hidden = false;
      }

      /* Active-project card: only once a project exists. */
      var card = el('miniProj');
      if (card && m.project) {
        set('miniProjName', m.project);
        set('miniProjLoc', m.location || '');
        var ms = el('miniSettle');
        if (ms) ms.style.setProperty('--pct', m.balanceBudget
          ? Math.round(m.balanceReleased / m.balanceBudget * 100) : 0);
        card.hidden = false;
      }

      window.App.start();
    };
  </script>
  <script type="module" src="shared/itd-admin-auth.js"></script>
</body>
</html>
